[project]
name = "querygraph-semantic-claude"
version = "0.1.0"
description = "Reference materials for QueryGraph AI Navigator + Apache Polaris + OSI alignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "QueryGraph.ai" }]
dependencies = [
    "pyyaml>=6.0",  # optional; src/osi_loader.py falls back to JSON if missing
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
